name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew

      - name: Run test harness
        run: .\gradlew.bat test --console=plain

      - name: Package Windows Installer
        run: .\gradlew.bat packageDistributionForCurrentOS --console=plain

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/exe/DailyHabit-*.exe
            build/compose/binaries/main/msi/DailyHabit-*.msi
          name: DailyHabit Windows ${{ github.ref_name }}
          body: |
            ## DailyHabit for Windows ${{ github.ref_name }}
            
            Compose Multiplatform (Desktop JVM) 기반의 Windows 데스크톱 버전입니다.
            
            ### 다운로드 파일
            - **EXE 설치 파일**: `DailyHabit-1.0.0.exe`
            - **MSI 윈도우 인스톨러**: `DailyHabit-1.0.0.msi`
            
            ### 주요 기능
            - 오늘의 말씀(복음) 및 오늘의 명언
            - 가톨릭 주요 기도문 및 묵주기도 신비
            - 할 일(Todo) 및 매일 루틴(스트릭 통계)
            - 한 줄 일기(기분 이모지) 및 맛집 기록
            - 독서 진행률 관리 및 일정 뷰
            - Android 버전 백업 JSON 100% 호환 복원/내보내기 및 엑셀(.xlsx) 내보내기
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
