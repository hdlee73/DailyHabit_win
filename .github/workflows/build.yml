name: Build & Release Windows

# main에 VERSION 파일의 새 버전이 올라오면 일반용·천주교인용 설치 파일을 만들어 릴리스한다.
# (안드로이드 저장소와 같은 방식: 태그 v<버전> = 일반용, v<버전>-catholic = 천주교인용)
# 판본마다 x64(일반 PC)·ARM64(Snapdragon 등) × .msi·.exe 네 파일을 올린다.
# 이미 있는 릴리스에 빠진 파일을 채우려면 Actions에서 backfill을 켜고 수동 실행한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backfill:
        description: "이미 있는 현재 버전 릴리스에 exe·ARM64 파일 추가"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          EXISTS=false
          gh release view "v${BASE}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && EXISTS=true
          RELEASE=none
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ "$EXISTS" == false ]]; then RELEASE=new
            elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.backfill }}" == "true" ]]; then RELEASE=backfill
            fi
          fi
          if [[ "$RELEASE" == none ]]; then NAME="${BASE}-dev.${GITHUB_RUN_NUMBER}"; else NAME="${BASE}"; fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "version ${NAME}, release ${RELEASE}"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            java: temurin
            suffix: ""
          - arch: arm64
            os: windows-11-arm
            java: microsoft
            # 이름 순서상 x64 .msi보다 뒤에 오도록 "-arm64-<버전>" (아래 release 주석 참고)
            suffix: "-arm64"
    runs-on: ${{ matrix.os }}
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java }}
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test (일반용 · 천주교인용)
        run: |
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.vendor ='
          # 화면 그리기까지 해서 ARM64에서도 skiko(그래픽) 네이티브 라이브러리가 실제로 로드되는지 확인
          for ed in general catholic; do
            ./gradlew.bat --no-daemon test -Pedition=$ed "-Pscreens=$PWD/screens/$ed" --console=plain
          done
          ls screens/*/ | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ env.VERSION_NAME }}-${{ matrix.arch }}
          path: screens/

      - name: Build installers (일반용 + 천주교인용, .msi + .exe)
        run: |
          mkdir -p dist
          for ed in general catholic; do
            [[ $ed == catholic ]] && NAME=DailyHabit-Catholic || NAME=DailyHabit
            rm -rf build/compose/binaries
            ./gradlew.bat --no-daemon packageMsi packageExe -Pedition=$ed --console=plain
            cp build/compose/binaries/main/msi/${NAME}-*.msi "dist/${NAME}${{ matrix.suffix }}-${VERSION_NAME}.msi"
            cp build/compose/binaries/main/exe/${NAME}-*.exe "dist/${NAME}${{ matrix.suffix }}-${VERSION_NAME}.exe"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DailyHabit-${{ env.VERSION_NAME }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.release != 'none'
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: DailyHabit-${{ needs.version.outputs.name }}-*
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          ls -la dist
          for ed in general catholic; do sed "s/@VERSION@/${V}/g" .github/release-notes/$ed.md > notes-$ed.md; done

      # 예전 버전(v1.7.0)의 자동 업데이트는 릴리스 API가 돌려주는 첫 번째 .msi를 받는다.
      # API는 파일을 올린 순서가 아니라 이름순으로 돌려주므로, ARM64 파일 이름을
      # DailyHabit-arm64-<버전>.msi로 해서 x64용 DailyHabit-<버전>.msi가 항상 먼저 오게 한다.
      # (v1.8.0은 DailyHabit-1.8.0-arm64.msi가 먼저 와서 v1.7.0이 x64 PC에 ARM64용을 받아 설치에 실패했다)
      - name: Release 일반용 (x64 msi)
        if: needs.version.outputs.release == 'new'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: DailyHabit for Windows v${{ env.V }}
          body_path: notes-general.md
          files: dist/DailyHabit-${{ env.V }}.msi
          make_latest: "true"

      - name: Release 일반용 (exe · ARM64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: DailyHabit for Windows v${{ env.V }}
          body_path: notes-general.md
          files: |
            dist/DailyHabit-${{ env.V }}.exe
            dist/DailyHabit-arm64-${{ env.V }}.msi
            dist/DailyHabit-arm64-${{ env.V }}.exe
          make_latest: "true"
          fail_on_unmatched_files: true

      - name: Release 천주교인용 (x64 msi)
        if: needs.version.outputs.release == 'new'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}-catholic
          target_commitish: ${{ github.sha }}
          name: DailyHabit 천주교인용 for Windows v${{ env.V }}
          body_path: notes-catholic.md
          files: dist/DailyHabit-Catholic-${{ env.V }}.msi
          make_latest: "false"

      - name: Release 천주교인용 (exe · ARM64)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}-catholic
          name: DailyHabit 천주교인용 for Windows v${{ env.V }}
          body_path: notes-catholic.md
          files: |
            dist/DailyHabit-Catholic-${{ env.V }}.exe
            dist/DailyHabit-Catholic-arm64-${{ env.V }}.msi
            dist/DailyHabit-Catholic-arm64-${{ env.V }}.exe
          make_latest: "false"
          fail_on_unmatched_files: true
